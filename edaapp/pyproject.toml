[project]
name = "edaapp"
version = "0.1.0"
description = "Local web app for exploring and improving datasets: the Hugging Face ones by default, or a local data folder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "pyarrow>=17",
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "huggingface-hub>=2.1",
]

[project.scripts]
edaapp = "edaapp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edaapp"]

[tool.ruff]
line-length = 120
target-version = "py311"
# keep ruff's cache inside edaapp/, never in the repo root
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# keep pytest's cache and its temporary fixture folders inside edaapp/ (run pytest from edaapp/)
cache_dir = ".pytest_cache"
addopts = "--basetemp=.pytest-tmp"
filterwarnings = ["ignore::DeprecationWarning:starlette", "ignore:Using `httpx`"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures and assertions read better on one line
